<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易网络词典</title>
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <aside>
        <div id="sidebar-header">
            <button id="hide-sidebar" type="button" data-title="收起侧边栏">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-left">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M15 6l-6 6l6 6" transform="translate(-4,0)" />
                    <path d="M15 6l-6 6l6 6" transform="translate(4,0)" />
                </svg>
            </button>
        </div>
        <div id="sidebar-main">
            <section id="sources">
                <h2>字典源</h2>
                <p>当前已选择<strong id="cur-source"></strong></p>
                <ul id="sources-list"></ul>
            </section>
        </div>
    </aside>
    <main>
        <nav>
            <form id="search" onsubmit="lookup(); return false;">
                <input type="text" id="query-box" name="q" placeholder="输入单词">
                <button type="submit" id="query-btn">
                    查词
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-search">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                        <path d="M21 21l-6 -6" />
                    </svg>
                </button>
            </form>
        </nav>
        <section id="result"></section>
    </main>
</body>

</html>
