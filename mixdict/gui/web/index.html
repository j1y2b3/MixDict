<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>东拼西凑的词典</title>
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <aside class="sidebar">
        <header class="sidebar__header">
            <button class="sidebar__toggle" id="sidebar-toggle" type="button" data-title="收起侧边栏">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-chevrons-left">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M11 7l-5 5l5 5" />
                    <path d="M17 7l-5 5l5 5" />
                </svg>
            </button>
        </header>
        <div class="sidebar__main">
            <section class="setting">
                <header>
                    <h2>设置</h2>
                </header>
                <ul class="setting__list">
                    <li>
                        <button class="setting__theme" id="theme-toggle" type="button">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round"
                                class="setting__sys-theme icon icon-tabler icons-tabler-outline icon-tabler-brightness">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
                                <path d="M12 3l0 18" />
                                <path d="M12 9l4.65 -4.65" />
                                <path d="M12 14.3l7.37 -7.37" />
                                <path d="M12 19.6l8.85 -8.85" />
                            </svg>
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round"
                                class="setting__light-theme icon icon-tabler icons-tabler-outline icon-tabler-sun">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                <path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
                                <path
                                    d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" />
                            </svg>
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round"
                                class="setting__dark-theme icon icon-tabler icons-tabler-outline icon-tabler-moon">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                <path
                                    d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454l0 .008" />
                            </svg>
                        </button>
                    </li>
                </ul>

            </section>
            <section class="source">
                <header>
                    <h2>字典源</h2>
                    <button type="button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-down">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M6 9l6 6l6 -6" />
                        </svg>
                    </button>
                </header>
                <p class="source__current u-truncate">当前已选择<strong id="source-current"></strong></p>
                <ul class="source__list" id="source-list"></ul>
            </section>
        </div>
        <div class="sidebar__resizer"></div>
    </aside>
    <main class="main">
        <form class="query" onsubmit="lookup(); return false;">
            <input class="query__input" id="query-input" type="text" name="q" placeholder="输入单词">
            <button class="query__button u-button-feedback" id="query-button" type="submit">
                查词
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-search">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                    <path d="M21 21l-6 -6" />
                </svg>
            </button>
        </form>
        <article class="query__result" id="query-result"></article>
    </main>
</body>

</html>
